name: RecallBond contract checks
on:
  push:
    paths: ['contract/**', '.github/workflows/contract-check.yml']
  pull_request:
    paths: ['contract/**', '.github/workflows/contract-check.yml']

jobs:
  test-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Contract unit tests
        run: cargo test --all-targets
      - name: Compile WASM target
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Record WASM SHA-256 for testnet deployment
        run: sha256sum target/wasm32-unknown-unknown/release/recallbond.wasm > target/wasm32-unknown-unknown/release/recallbond.wasm.sha256
      - name: Upload testnet deployment build artifact
        uses: actions/upload-artifact@v4
        with:
          name: recallbond-testnet-wasm
          path: |
            contract/target/wasm32-unknown-unknown/release/recallbond.wasm
            contract/target/wasm32-unknown-unknown/release/recallbond.wasm.sha256
          if-no-files-found: error
          retention-days: 7
