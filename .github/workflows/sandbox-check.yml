name: NEAR Sandbox end-to-end
on:
  push:
    paths: ['contract/**','integration/**','.github/workflows/sandbox-check.yml']
  pull_request:
    paths: ['contract/**','integration/**','.github/workflows/sandbox-check.yml']

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Build contract for on-chain runtime
        run: |
          cd contract
          RUSTFLAGS="--cfg near" cargo build --release --target wasm32-unknown-unknown
          test -s target/wasm32-unknown-unknown/release/recallbond.wasm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sandbox runner
        working-directory: integration
        run: npm install --no-audit --no-fund
      - name: Execute full lifecycle on local NEAR Sandbox
        working-directory: integration
        run: npm test
