name: NEAR Sandbox end-to-end
on:
  push:
    paths: ['contract/**','integration/**','.github/workflows/sandbox-check.yml']
  pull_request:
    paths: ['contract/**','integration/**','.github/workflows/sandbox-check.yml']

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Install NEAR's contract packager (pinned release)
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh \
            --output /tmp/cargo-near-installer.sh
          sh /tmp/cargo-near-installer.sh
      - name: Build and optimize contract with cargo-near
        run: |
          cd contract
          cargo near build non-reproducible-wasm --no-abi
          wasm_path="$(find target/near -type f -name 'recallbond.wasm' | head -n 1)"
          test -n "$wasm_path" && test -s "$wasm_path"
          mkdir -p target/wasm32-unknown-unknown/release
          cp "$wasm_path" target/wasm32-unknown-unknown/release/recallbond.wasm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sandbox runner
        working-directory: integration
        run: npm install --no-audit --no-fund
      - name: Install compatible NEAR Sandbox 2.13.0 runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/recallbond-sandbox
          curl --fail --location --silent --show-error \
            "https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/2.13.0/near-sandbox.tar.gz" \
            --output /tmp/recallbond-sandbox.tar.gz
          tar -xzf /tmp/recallbond-sandbox.tar.gz -C /tmp/recallbond-sandbox
          sandbox_bin="$(find /tmp/recallbond-sandbox -type f -name 'near-sandbox' | head -n1)"
          test -n "$sandbox_bin"
          chmod +x "$sandbox_bin"
          echo "NEAR_SANDBOX_BIN_PATH=$sandbox_bin" >> "$GITHUB_ENV"
      - name: Execute full lifecycle on local NEAR Sandbox
        working-directory: integration
        run: npm test
      - name: Upload sandbox-validated contract WASM
        uses: actions/upload-artifact@v4
        with:
          name: recallbond-sandbox-validated-wasm
          path: contract/target/near/recallbond.wasm
          if-no-files-found: error
          retention-days: 7
